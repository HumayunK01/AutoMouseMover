name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -v

  build:
    name: Build Standalone Executable
    needs: test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller AutoMouseMover.spec --noconfirm

      - name: Verify Executable
        shell: pwsh
        run: |
          if (Test-Path dist/AutoMouseMover.exe) {
            $bytes = (Get-Item dist/AutoMouseMover.exe).Length
            Write-Host "AutoMouseMover.exe compiled successfully ($bytes bytes)."
          } else {
            Write-Error "dist/AutoMouseMover.exe was not generated."
            exit 1
          }
